name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test fishing session
        run: node scripts/fishing-session-test.mjs
      - name: Test fishing controller
        run: node scripts/fishing-controller-test.mjs
      - name: Test fishing runtime installation
        run: node scripts/fishing-install-order-test.mjs
      - name: Test bite timing
        run: node scripts/bite-timing-test.mjs
      - name: Test multiplayer fishing sync
        run: node scripts/mp-fishing-sync-test.mjs
      - name: Test shared world
        run: node scripts/mp-world-test.mjs
      - name: Sync RealtimeKit Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put REALTIMEKIT_API_TOKEN
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.125.0'
          command: deploy
