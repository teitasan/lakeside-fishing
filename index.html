<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>湖畔のフィッシング — Lakeside Fishing</title>
<link rel="stylesheet" href="./css/style.css" />
<link rel="stylesheet" href="./css/voice.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="underwater-tint"></div>
  <div id="vignette"></div>
  <div id="tension-vignette"></div>
  <div id="hud">
    <div class="hud-top-left panel"><div class="money-row"><span class="coin"><img class="ico" src="./assets/icons/ui-coin.webp" alt="" width="16" height="16"></span><span id="money">0</span><span class="unit">G</span></div><div class="level-row"><span class="lv">Lv <b id="level">1</b></span><div class="xp-bar"><i id="xp-fill"></i></div><span id="xp-text" class="xp-text">0 / 60</span></div><div class="gear-row"><span id="gear-rod"><img class="ico gear" src="./assets/icons/rod-bamboo.webp" alt="" width="16" height="16"> 竹の釣り竿</span><span id="gear-bait"><img class="ico gear" src="./assets/icons/bait-worm.webp" alt="" width="16" height="16"> ミミズ</span></div></div>
    <div class="hud-top-right panel"><div class="clock-row"><span id="weather-icon"><img class="ico weather" src="./assets/icons/weather-clear.webp" alt="" width="18" height="18"></span><span id="clock">06:00</span><span id="daylabel">朝</span></div><div class="info-row"><span class="lbl" data-i18n="ui.hud.weather">天候</span><span id="weather-name">晴れ</span></div><div class="info-row"><span class="lbl" data-i18n="ui.hud.aim">狙い</span><span id="aim">-- m</span></div><div class="info-row"><span class="lbl" data-i18n="ui.hud.depth">水深</span><span id="depth">-- m</span></div><div class="info-row"><span class="lbl" data-i18n="ui.hud.rig">タナ</span><span id="rig">-- m</span></div><div class="info-row"><span class="lbl" data-i18n="ui.hud.caught">釣果</span><span id="caught-count">0</span></div></div>
  </div>
  <div id="loading"><span>読み込み中</span></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
